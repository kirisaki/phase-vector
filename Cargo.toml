[package]
name = "phase-vector"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "A browser-based 2D space tactics proof of concept about future-position interdiction."
authors = ["Akihito Kirisaki <kirisaki@klara.works>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/kirisaki/phase-vector"
readme = "README.md"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
piccolo = "=0.3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "=0.20.1", default-features = false, features = [
  "std", "async_executor", "bevy_asset", "bevy_log", "bevy_winit",
  "bevy_core_pipeline", "bevy_gizmos", "bevy_gizmos_render", "webgl2",
] }
wasm-bindgen = "=0.2.130"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
