name: Bootstrap dependencies
on:
  push:
    branches: [step-1-browser]
    paths: [.github/workflows/bootstrap.yml, Cargo.toml]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup show active-toolchain
      - run: cargo fetch --target wasm32-unknown-unknown --target x86_64-unknown-linux-gnu
      - run: tar -czf registry.tar.gz -C "$HOME/.cargo" registry
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dependencies
          path: |
            registry.tar.gz
            Cargo.lock
          retention-days: 1
